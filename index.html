<!DOCTYPE html>
<html lang="zh-CN">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的账本">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>我的账本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: light card ledger. Single column (max 640px), month header, four views, fixed bottom nav with a raised add button. */
:root {
  --bg: #f5f7fa;
  --surface: #ffffff;
  --hero: #fff3ef;
  --hero-line: #f6d6cc;
  --hero-ink: #101828;
  --hero-sub: #5d6679;
  --ink: #101828;
  --ink-2: #475467;
  --muted: #667085;
  --line: #e4e7ec;
  --line-soft: #eef0f3;
  --accent: #d1452b;
  --on-accent: #ffffff;
  --in: #067647;
  --danger: #c4320a;
  --hero-danger: #c4320a;
  --warn-bg: #fef0c7;
  --warn-ink: #7a4b00;
  --track: #eaecf0;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
  --f-num: "Outfit", "Noto Sans SC", system-ui, sans-serif;
  --f-body: "Noto Sans SC", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --nav-h: 68px;
}
/* Light only, by choice: the page stays light even when the phone is in dark mode. */
:root { color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); }
.top .wrap { padding-block: 14px 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.month { display: flex; align-items: center; gap: 2px; }
.month h1 { margin: 0 6px; font-size: 1.3rem; font-weight: 700; letter-spacing: -0.01em; }
.month button { width: 36px; height: 36px; border: 0; background: none; border-radius: 10px; display: grid; place-items: center; color: var(--ink-2); }
.month button:hover { background: var(--line-soft); }
.month button:disabled { opacity: .3; cursor: default; background: none; }
.month .m-title { width: auto; height: auto; padding: 4px 8px; margin: 0 2px; font-size: 1.3rem; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); display: flex; align-items: center; gap: 4px; }
.m-title .caret { font-size: .7rem; color: var(--muted); }
.mp-year { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; text-align: center; }
.mp-year b { font-size: 1.1rem; }
.mp-year button { width: 44px; height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; font-size: 1.2rem; }
.mp-year button:disabled { opacity: .3; }
.mp-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.mp-grid button { height: 54px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; font-size: 1rem; position: relative; }
.mp-grid button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.mp-grid button:disabled { color: #c0c5cd; background: var(--bg); }
.mp-grid button i { position: absolute; bottom: 7px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--accent); }
.mp-grid button.on i { background: var(--on-accent); }
.wallets { display: flex; gap: 14px; }
.gear { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-2); }
.gear:hover, .gear[aria-current="page"] { background: var(--line-soft); color: var(--ink); }
.wallet { display: grid; justify-items: end; line-height: 1.25; }
.wallet small { color: var(--muted); font-size: .75rem; }
.wallet b { font-family: var(--f-num); font-weight: 600; font-size: 1.02rem; }

main .wrap { padding-block: 4px calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 28px); display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; }
.card h2, .sec-h { font-size: .85rem; font-weight: 500; color: var(--muted); margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sec-h { margin: 0 2px -8px; }
.linkish { border: 0; background: none; color: var(--accent); padding: 4px 0; font-weight: 500; font-size: .85rem; text-decoration: none; }
.note { color: var(--muted); font-size: .85rem; }
.status { text-align: center; padding: 48px 12px; color: var(--ink-2); }
.pos { color: var(--in); }
.over { color: var(--danger); }

/* hero */
.hero { background: var(--hero); color: var(--hero-ink); border: 1px solid var(--hero-line); border-radius: 20px; padding: 20px; display: grid; gap: 14px; }
.hero .lbl { font-size: .82rem; color: var(--hero-sub); }
.hero .big { font-family: var(--f-num); font-size: clamp(2.4rem, 11vw, 2.9rem); font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
.hero .big span { font-size: .55em; color: var(--hero-sub); }
.stack { display: flex; gap: 2px; height: 10px; }
.stack i { display: block; border-radius: 3px; min-width: 3px; }
.hero .row2 { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: .85rem; color: var(--hero-sub); }
.hero .row2 b { font-family: var(--f-num); font-weight: 600; color: var(--hero-ink); }
.hero .row2 b.neg { color: var(--hero-danger); }
.budget { display: grid; gap: 6px; padding-top: 12px; border-top: 1px solid color-mix(in srgb, var(--hero-sub) 25%, transparent); }
.budget .top-line { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.budget .left { font-family: var(--f-num); font-weight: 700; font-size: 1.35rem; }
.budget .left.neg { color: var(--hero-danger); }
.budget .bar { height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--hero-sub) 25%, transparent); overflow: hidden; }
.budget .bar i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.budget .bar i.neg { background: var(--hero-danger); }
.budget small { color: var(--hero-sub); font-size: .8rem; }
.hero .set-budget { justify-self: start; border: 1px solid color-mix(in srgb, var(--hero-sub) 45%, transparent); background: none; color: var(--hero-ink); border-radius: 999px; padding: 5px 14px; font-size: .82rem; }

/* category tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; text-align: left; display: grid; gap: 3px; min-width: 0; }
.tile:hover { border-color: var(--ink-2); }
.tile .nm { display: flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .amt { font-family: var(--f-num); font-size: 1.25rem; font-weight: 600; }
.tile .sub { font-size: .75rem; color: var(--muted); }
.tile .perday { font-size: .78rem; color: var(--ink-2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .perday b { font-family: var(--f-num); color: var(--ink); font-weight: 600; }
.tile .tbar { height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; margin-top: 4px; }
.tile .tbar i { display: block; height: 100%; border-radius: 3px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }

/* quick add */
.quick { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.qbtn { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 0 14px; height: 44px; font-weight: 500; }
.qbtn:hover { border-color: var(--ink-2); }

.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--warn-bg); color: var(--warn-ink); border: 0; border-radius: 12px; padding: 12px 14px; width: 100%; text-align: left; font-size: .9rem; }

/* lists */
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line-soft); cursor: pointer; }
.rows .row:first-child { border-top: 0; }
.row:hover { background: var(--line-soft); }
.ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: .8rem; font-weight: 700; }
.row .mid { min-width: 0; display: grid; }
.row .desc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; font-size: .95rem; }
.row .meta { color: var(--muted); font-size: .78rem; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.row .amt { font-family: var(--f-num); font-weight: 600; text-align: right; white-space: nowrap; }
.tag-guess { background: var(--warn-bg); color: var(--warn-ink); border-radius: 6px; padding: 0 6px; font-size: .72rem; }
.ok-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 0 8px; font-size: .72rem; color: var(--ink-2); }
.day-h { display: flex; justify-content: space-between; color: var(--muted); font-size: .8rem; padding: 0 4px 6px; }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tools input[type=search] { flex: 1 1 180px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 12px; }
.tools select { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 10px; }
.sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.sum > div { background: var(--surface); padding: 10px 14px; display: grid; min-width: 0; }
.sum small { color: var(--muted); font-size: .78rem; }
.sum b { font-family: var(--f-num); font-weight: 600; font-size: clamp(.98rem, 4vw, 1.2rem); white-space: nowrap; }

/* stats */
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 6.5em minmax(0,1fr) auto; gap: 10px; align-items: center; }
.bar-row .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .9rem; }
.bar-track { height: 12px; }
.bar-fill { display: block; height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
.bar-row .val { font-family: var(--f-num); font-size: .9rem; white-space: nowrap; text-align: right; }
.bar-row .val small { color: var(--muted); margin-left: 6px; }
.daily { position: relative; }
.daily-plot { position: relative; height: 150px; margin-left: 38px; display: flex; align-items: flex-end; gap: 2px; border-bottom: 1px solid var(--ink-2); }
.gl { position: absolute; left: -38px; right: 0; border-top: 1px solid var(--line-soft); }
.gl span { position: absolute; left: 0; top: -.65em; font-family: var(--f-num); font-size: .68rem; color: var(--muted); width: 32px; text-align: right; background: var(--surface); }
.avg { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--ink-2); z-index: 2; pointer-events: none; }
.avg-key { display: inline-block; width: 22px; border-top: 2px dashed var(--ink-2); }
.avg span { position: absolute; right: 0; top: -1.5em; font-size: .7rem; color: var(--ink-2); background: var(--surface); padding: 0 4px; }
.dbar { flex: 1 1 0; min-width: 0; height: 100%; display: flex; align-items: flex-end; position: relative; z-index: 1; cursor: pointer; }
.dbar i { display: block; width: 100%; background: var(--c1); border-radius: 3px 3px 0 0; }
.dbar:hover i, .dbar.on i { background: var(--ink); }
.daily-x { margin-left: 38px; display: flex; justify-content: space-between; font-family: var(--f-num); font-size: .68rem; color: var(--muted); padding-top: 4px; }
.tip { position: absolute; z-index: 3; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 6px 10px; font-size: .8rem; white-space: nowrap; transform: translate(-50%, -100%); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
table.mini { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.mini td { padding: 7px 0; border-top: 1px solid var(--line-soft); }
table.mini tr:first-child td { border-top: 0; }
table.mini td:last-child { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 10px; }
table.mini td small { color: var(--muted); }

/* settings */
.set-row { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line-soft); }
.set-row:first-of-type { border-top: 0; }
.set-row input[type=text], .set-row input[inputmode] { width: 100%; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 6px 8px; }
.set-row input:hover, .set-row input:focus { border-color: var(--line); background: var(--bg); }
.money-in { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 0 10px; }
.money-in input { border: 0 !important; background: transparent !important; width: 6.5em; padding: 8px 0 !important; font-family: var(--f-num); text-align: right; }
.money-in span { color: var(--muted); font-size: .85rem; }
.swatches { display: flex; gap: 4px; flex-wrap: wrap; }
.sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 16px; font-weight: 500; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.danger.arm { background: var(--danger); color: #fff; border-color: var(--danger); }
.big-in { background: var(--surface); border-color: var(--hero-line); padding: 0 14px; }
.big-in span { font-family: var(--f-num); font-size: 1.1rem; }
.big-in input { width: 100% !important; font-size: 1.9rem !important; font-weight: 700; text-align: left !important; padding: 6px 0 !important; }
.chip-ok, .chip-warn { border-radius: 999px; padding: 1px 10px; font-size: .78rem; }
.chip-ok { background: #e6f4ea; color: #0b5b2e; }
.chip-warn { background: var(--warn-bg); color: var(--warn-ink); }
.brows { display: grid; padding-block: 4px; }
.brow { display: grid; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line-soft); }
.brow:first-child { border-top: 0; }
.brow-top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.brow-top select { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 7px 10px; min-width: 0; width: 100%; font-weight: 500; }
.brow-in { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.brow-in .pct input { width: 3.5em; }
.brow-in .eq { color: var(--muted); }
.alloc-sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.alloc-sum > div { background: var(--surface); padding: 10px 12px; display: grid; min-width: 0; }
.alloc-sum small { color: var(--muted); font-size: .75rem; }
.alloc-sum b { font-family: var(--f-num); font-weight: 600; font-size: 1.02rem; white-space: nowrap; }
.alloc-sum .over b { color: var(--danger); }
.brow .tbar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.brow .tbar i { display: block; height: 100%; border-radius: 3px; }
.brow-day { font-size: .82rem; color: var(--ink-2); background: var(--bg); border-radius: 8px; padding: 5px 9px; justify-self: start; }
.brow-day b { color: var(--ink); }
.brow-foot { display: flex; justify-content: space-between; gap: 8px; font-size: .8rem; color: var(--muted); flex-wrap: wrap; }
.icon-btn { width: 36px; height: 36px; border: 0; background: none; border-radius: 10px; color: var(--muted); display: grid; place-items: center; }
.icon-btn:hover { background: var(--line-soft); color: var(--ink); }
.chk { display: flex; gap: 6px; align-items: center; font-size: .82rem; color: var(--ink-2); white-space: nowrap; }
.addline { display: flex; gap: 8px; margin-top: 10px; }
.addline input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 9px 12px; }

/* bottom nav */
nav.bottom { position: fixed; z-index: 6; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.bottom .in { max-width: 640px; margin: 0 auto; height: var(--nav-h); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; }
nav.bottom a { text-decoration: none; color: var(--muted); display: grid; justify-items: center; gap: 2px; font-size: .7rem; padding: 6px 0; }
nav.bottom a[aria-current="page"] { color: var(--ink); font-weight: 700; }
nav.bottom svg { width: 22px; height: 22px; }
.add-btn { justify-self: center; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; margin-top: -26px; box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 40%, transparent); }

/* sheet */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(8,12,20,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
@media (min-width: 640px) { .overlay { align-items: center; } .sheet { border-radius: 20px; } }
.sheet h3 { margin: 0; font-size: 1.15rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 7px 16px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.amount-in { width: 100%; font-family: var(--f-num); font-weight: 600; font-size: 2.2rem; border: 0; border-bottom: 2px solid var(--line); background: transparent; padding: 4px 0; }
.amount-in:focus { outline: none; border-bottom-color: var(--accent); }
.field { display: grid; gap: 4px; }
.field label { font-size: .78rem; color: var(--muted); }
.field input, .field select { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 9px 12px; width: 100%; min-width: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 12px 5px 9px; display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--ink); }
.actions { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; align-items: center; }
.sh-head { display: grid; grid-template-columns: 5.5em minmax(0, 1fr) 5.5em; align-items: center; gap: 8px; }
.sh-head h3 { text-align: center; font-size: 1.05rem; }
.sh-nav { border: 0; background: none; color: var(--ink-2); padding: 8px 0; text-align: left; font-size: .95rem; min-height: 40px; }
.steps { display: flex; gap: 6px; justify-content: center; margin-top: -6px; }
.steps i { width: 24px; height: 4px; border-radius: 2px; background: var(--line); }
.steps i.on { background: var(--accent); }
.seg-wrap { display: flex; justify-content: center; }
.amt-display { display: flex; align-items: baseline; justify-content: center; gap: 8px; padding: 6px 0 2px; }
.amt-display span { font-family: var(--f-num); font-size: 1.3rem; color: var(--muted); }

const rowPct = (b, r) => r.by === 'amt' ? (b.total > 0 ? (Number(r.amt) || 0) / b.total * 100 : 0) : (Number(r.pct) || 0);
const trimNum = n => String(Math.round((Number(n) || 0) * 100) / 100);
const budget = () => {
  const b = { total: 0, ...(settings().budget || {}) };
  if (!Array.isArray(b.alloc)) b.alloc = DEFAULT_ALLOC.filter(r => r.cat === REST || settings().cats.some(c => c.id === r.cat));

};
const catOf = id => settings().cats.find(c => c.id === id) || settings().cats.find(c => c.id === 'other') || { id: 'other', name: '其他', color: 5, kind: 'normal' };
const acctOf = id => settings().accounts.find(a => a.id === id) || { id, name: id, opening: 0 };
const color = c => `var(--c${c})`;
const tint = c => `color-mix(in srgb, var(--c${c}) 16%, var(--surface))`;
const iconOf = c => ICONS[c.id] || [...c.name][0] || '·';
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const counts = t => catOf(t.cat).kind !== 'transfer';
const spendCats = () => settings().cats.filter(c => c.kind !== 'transfer' && c.id !== 'income');

function toast(msg, act) {

  if (el.hidden && !calm()) el.animate([{ opacity: 0, transform: 'translate(-50%, 14px)' }, { opacity: 1, transform: 'translate(-50%, 0)' }], { duration: 220, easing: 'cubic-bezier(.2,1.3,.4,1)' });
  el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; toast.fn = null; }, act ? 6000 : 2200);

/* ---------- data (Google Sheet via Apps Script) ---------- */
// 在 Google 里打开就用 google.script.run；在 GitHub 的新版就用「网址 + 连接密码」
const WEB = !(window.google && google.script && google.script.run);
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
function readConn() {
  try {
    const h = new URLSearchParams(location.hash.slice(1)), u = h.get('u'), k = h.get('k');
    if (u && k && /^https:\/\/script\.google\.com\//.test(u)) { store.set('ledger.conn', { u, k }); return { u, k }; }
  } catch {}
  const c = store.get('ledger.conn'); return c && c.u && c.k ? c : null;
}
let CONN = WEB ? readConn() : null;
// 没网络时先存在手机里，有网络再一笔一笔补上去（只限这几种）
const OUTBOXABLE = ['saveTxn', 'saveTxns', 'deleteTxn', 'saveSettings'];
async function webCall(fn, args) {
  if (!CONN) throw new Error('还没连接账本');
  let r;
  try { r = await fetch(CONN.u, { method: 'POST', body: JSON.stringify({ k: CONN.k, fn, args }) }); }
  catch { const e = new Error(navigator.onLine === false ? '没有网络' : '连不上 Google 的账本（没有网络，或部署的「谁可以访问」不是「任何人」）'); e.offline = true; throw e; }
  let d = null; try { d = await r.json(); } catch {}
  if (!d) throw new Error(`Google 没有回应（${r.status}）`);
  if (!d.ok) throw new Error(d.error || '出错了');
  return d.result;
}
async function flushOutbox() {
  let box = store.get('ledger.outbox') || [];
  while (box.length) {
    await webCall(box[0].fn, box[0].args);   // 没网络会丢错误，剩下的留着下次
    box = (store.get('ledger.outbox') || []).slice(1); store.set('ledger.outbox', box);
  }
}
async function webApi(fn, args) {
  if ((store.get('ledger.outbox') || []).length) { try { await flushOutbox(); } catch (e) { if (!e.offline) throw e; } }
  try { return await webCall(fn, args); }
  catch (e) {
    if (!e.offline || !OUTBOXABLE.includes(fn)) throw e;
    store.set('ledger.outbox', [...(store.get('ledger.outbox') || []), { fn, args }]);
    toast('没有网络，先存在手机里，有网络会自动同步');
    return null;
  }
}
const api = (fn, ...args) => WEB ? webApi(fn, args) : new Promise((resolve, reject) => {
  google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
});
const errMsg = e => (e && (e.message || e.code)) || String(e);
let writeQueue = Promise.resolve();
function queued(fn) { const p = writeQueue.then(fn); writeQueue = p.catch(() => {}); return p; }
function saveSettings(next) {
  S.settings = next; render();
  return queued(() => api('saveSettings', next)).catch(e => { toast('设置没存上：' + errMsg(e)); reload(); });
}
async function saveTxn(t) {
  S.txns.set(t.id, t); render();
  try { await queued(() => api('saveTxn', t)); } catch (e) { toast('没存上：' + errMsg(e)); reload(); throw e; }
}
async function saveTxns(list) {
  if (!list.length) return;
  list.forEach(t => S.txns.set(t.id, t)); render();
  try { await queued(() => api('saveTxns', list)); } catch (e) { toast('没存上：' + errMsg(e)); reload(); throw e; }
}
async function deleteTxn(id) {
  const old = S.txns.get(id);
  await moOut(rowOf(id));
  S.txns.delete(id); render();
  try { await queued(() => api('deleteTxn', id)); } catch (e) { toast('删除失败：' + errMsg(e)); reload(); return; }
  if (old) toast('已删除', { label: '撤销', fn: async () => { try { MO.fresh = { id: old.id }; await saveTxn(old); toast('已恢复'); } catch {} } });
}
let lastLoad = 0;
function applyData(d) {
  S.txns = new Map(d.txns.map(t => [t.id, t]));
  S.settings = { ...DEFAULT_SETTINGS, ...d.settings };
  S.sheetUrl = d.sheetUrl || '';
  S.stmts = d.stmts || [];
}
async function reload() {
  try {
    await writeQueue;
    if (WEB) await flushOutbox();
    const d = await api('getAll');
    if (WEB) store.set('ledger.cache', d);
    applyData(d);
    S.loaded = true; lastLoad = Date.now();
    render();
  } catch (e) {
    if (!S.loaded) $('#view').innerHTML = `<div class="status">读取失败：${esc(errMsg(e))}<br><br><button class="btn" onclick="location.reload()">再试一次</button></div>`;
    else toast(e.offline ? '没有网络，显示的是上次的资料' : '同步失败：' + errMsg(e));
  }
}
function months() {
  const set = new Set([today().slice(0, 7)]);
  for (const t of S.txns.values()) set.add(t.date.slice(0, 7));
  return [...set].sort();
}
function monthTxns(m = S.month) { return [...S.txns.values()].filter(t => t.date.startsWith(m)); }
function balance(acctId) {
  const a = acctOf(acctId); let b = Number(a.opening) || 0;
  for (const t of S.txns.values()) if (t.account === acctId) b += t.dir === 'in' ? t.amount : -t.amount;
  return r2(b);
}
function cardSpend(acctId) {
  return r2(monthTxns().filter(t => t.account === acctId && t.dir === 'out').reduce((a, t) => a + t.amount, 0));
}
function summary(list) {
  let out = 0, inn = 0;
  for (const t of list) if (counts(t)) t.dir === 'out' ? out += t.amount : inn += t.amount;
  return { out: r2(out), inn: r2(inn), net: r2(inn - out) };
}
function spendByCat(list) {
  const m = new Map();
  for (const t of list) if (t.dir === 'out' && counts(t)) m.set(t.cat, r2((m.get(t.cat) || 0) + t.amount));
  return m;
}
const sortDesc = (a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')) || b.id.localeCompare(a.id);

/* ---------- home ---------- */
function daysInfo() {

  const days = new Date(y, m, 0).getDate();
  const t = today();
  const isCur = t.startsWith(S.month);
  const isPast = S.month < t.slice(0, 7);
  const left = isCur ? days - +t.slice(8) + 1 : isPast ? 0 : days;
  return { days, left, isCur, isPast };
}

/* ---------- flow ---------- */

/* ---------- stats ---------- */
function niceMax(v) { if (v <= 0) return 10; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p; return 10 * p; }
function statSeg() { const v = S.statView === 'year' ? 'year' : 'month'; return `<div class="seg-wrap"><div class="seg"><button data-statview="month" aria-pressed="${v === 'month'}">本月</button><button data-statview="year" aria-pressed="${v === 'year'}">全年</button></div></div>`; }
function renderYear() {

  const outs = all.filter(t => t.dir === 'out' && counts(t));
  const ymax = niceMax(Math.max(...per.map(x => x.out)));
  const avg = withData.length ? s.out / withData.length : 0;
  const hi = [...withData].sort((a, b) => b.out - a.out)[0];
  const lo = [...withData].sort((a, b) => a.out - b.out)[0];
  const cats = [...spendByCat(all)].sort((a, b) => b[1] - a[1]);
  const cmax = cats.length ? cats[0][1] : 1;
  const top5 = [...outs].sort((a, b) => b.amount - a.amount).slice(0, 5);
  return `${statSeg()}
  <div class="sum"><div><small>${y} 年支出</small><b>${money(s.out)}</b></div><div><small>收入</small><b class="pos">${money(s.inn)}</b></div><div><small>结余</small><b class="${s.net >= 0 ? 'pos' : 'over'}">${money(s.net)}</b></div></div>
  <section class="card"><h2>每个月支出 <span class="note" style="font-weight:400">月均 ${money(r2(avg))}</span></h2>
    <div class="daily" id="yearly">
      <div class="daily-plot yr-plot" style="gap:6px">
        ${[0, ymax / 2, ymax].map(v => `<div class="gl" style="bottom:${v / ymax * 100}%"><span>${v}</span></div>`).join('')}
        ${avg ? `<div class="avg" style="bottom:${(avg / ymax * 100).toFixed(1)}%"></div>` : ''}
        ${per.map(x => `<button type="button" class="dbar ${x.k === S.month ? 'cur' : ''} ${x.n ? '' : 'none'}" ${x.n ? `data-gomonth="${x.k}"` : 'disabled'} aria-label="${x.m}月 ${money(x.out)}"><i style="height:${x.out ? Math.max(x.out / ymax * 100, 1.5) : 0}%"></i></button>`).join('')}
      </div>

  for (const t of outs) { const w = new Date(t.date + 'T00:00:00').getDay(); const k = w === 0 || w === 6 ? 'e' : 'd'; wk[k].sum += t.amount; wk[k].by.set(t.cat, (wk[k].by.get(t.cat) || 0) + t.amount); }
  const wkBox = (k, label) => { const o = wk[k]; const per = o.n ? o.sum / o.n : 0; return `<div class="wk-box"><small>${label}（${o.n} 天）</small><b class="num">${money(r2(o.sum))}</b><small>每天约 ${money(r2(per))}</small>
    <div class="wk-cats">${[...o.by].sort((x, y) => y[1] - x[1]).slice(0, 3).map(([c, v]) => `<span><span class="dot" style="background:${color(catOf(c).color)}"></span>${esc(catOf(c).name.split(' / ')[0])} <span class="num">${money(r2(v))}</span></span>`).join('')}</div></div>`; };
  const perD = wk.d.n ? wk.d.sum / wk.d.n : 0, perE = wk.e.n ? wk.e.sum / wk.e.n : 0;

  const tollDays = new Set(tolls.map(t => t.date)).size;

    <p class="note" style="margin-bottom:0">${hasPrev ? `▲▼ 是跟 ${+prevKey.slice(5)} 月比较。上个月的资料如果不完整，比较只能参考。` : `上个月（${+prevKey.slice(5)} 月）没有资料，暂时不能比较。`}</p>

    </div>

  <section class="card"><h2>最大的 5 笔</h2>

/* ---------- credit card ---------- */
const WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
const addDays = (ymd, n) => { const d = new Date(ymd + 'T00:00:00'); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
const cnDate = ymd => `${+ymd.slice(5, 7)} 月 ${+ymd.slice(8)} 日`;
const wdOf = ymd => WD[new Date(ymd + 'T00:00:00').getDay()];
function creditAcct() { return settings().accounts.find(a => a.kind === 'credit'); }
function cardStmts(acctId) { return (S.stmts || []).filter(s => s.account === acctId).sort((a, b) => b.date.localeCompare(a.date)); }
function autoMin(amount, cards) { return r2(Math.max(Math.ceil(amount * 5) / 100, 25 * (cards || 1), 0)); }
function lateFee(amount, cards) { const n = cards || 1; return r2(n * Math.max(10, Math.min(100, amount / n * 0.01))); }
// 建议还款日：截止日前 4 天，碰到周末再推到周五（跨行转账要 1–2 个工作天）
function suggestDate(due) { let d = addDays(due, -4); const w = new Date(d + 'T00:00:00').getDay(); if (w === 6) d = addDays(d, -1); if (w === 0) d = addDays(d, -2); return d; }
function payAdvice(s) {
  const st = stmtStatus(s); if (st.k === 'full') return null;
  const sug = suggestDate(s.due); const remain = r2(s.amount - s.paid);
  const late = daysBetween(today(), sug) < 0;
  return { when: late ? (st.left >= 0 ? s.due : null) : sug, late, remain,
    what: s.paid > 0 ? `剩下的 ${money(remain)}` : `全额 ${money(s.amount)}`, floor: s.paid >= s.min ? 0 : r2(s.min - s.paid) };
}
function stmtStatus(s) {
  const left = daysBetween(today(), s.due);
  if (s.paid >= s.amount) return { k: 'full', left };
  if (left < 0) return { k: s.paid >= s.min ? 'lateInt' : 'overdue', left };
  return { k: s.paid >= s.min ? 'minPaid' : 'due', left };
}
function unbilled(acctId, since) {
  const list = [...S.txns.values()].filter(t => t.account === acctId && t.dir === 'out' && t.date > since);
  return { sum: r2(list.reduce((a, t) => a + t.amount, 0)), n: list.length };
}

// 只在打开时画一次；之后只换 class，动画才不会断
function buildFan() {
  const s = settings(), cats = fanCats(), accts = s.accounts;
  $('#fan').innerHTML = `<div class="fan-label" style="bottom:${Math.round(innerHeight - (fan.cy - fan.r2) + 14)}px"><div class="fan-pill" id="fan-pill"></div></div>
    <svg width="${innerWidth}" height="${innerHeight}" aria-hidden="true" style="--cx:${fan.cx}px;--cy:${fan.cy}px" data-cx="${fan.cx}" data-cy="${fan.cy}" data-r0="${fan.r0}" data-r1="${fan.r1}" data-r2="${fan.r2}">
      ${fanRing(accts, fan.r0, fan.r1, 'acct', 0)}
      ${fanRing(cats, fan.r1, fan.r2, 'cat', 60)}
      <g class="fan-in" style="animation-delay:0ms"><g class="fan-mid" id="fan-mid"><circle cx="${fan.cx}" cy="${fan.cy}" r="${fan.r0 - 4}"/>
      <text x="${fan.cx}" y="${fan.cy + 6}" class="fan-x">✕</text></g></g>
    </svg>`;
}
function drawFan() {
  const s = settings(), cats = fanCats(), accts = s.accounts;
  const a = accts[fan.acct], c = fan.cat != null ? cats[fan.cat] : null;
  $('#fan').querySelectorAll('.fan-seg').forEach(g => {
    const k = g.dataset.k; g.classList.toggle('on', k === `acct${fan.acct}` || (fan.cat != null && k === `cat${fan.cat}`));
  });
  $('#fan-mid').classList.toggle('on', fan.zone === 'cancel');
  const pill = $('#fan-pill');
  const html = c ? `<b>${esc(a.name)} · ${esc(c.name)}</b><small>放手去输入金额</small>` : fan.zone === 'cancel' ? '<b>放手取消</b><small>往上划选账户和分类</small>'
    : fan.zone === 'idle' ? `<b>往上划</b><small>内圈选账户（现在：${esc(a.name)}），外圈选分类</small>` : `<b>${esc(a.name)}</b><small>滑到外圈的分类，放手</small>`;
  if (pill.innerHTML !== html) { pill.innerHTML = html; pill.classList.remove('bump'); void pill.offsetWidth; pill.classList.add('bump'); }
}
function openFan() {
  const r = $('#add').getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;   // 从 ＋ 的位置弹出
  const r2 = Math.min(178, cx - 6, innerWidth - cx - 6);
  const accts = settings().accounts;
  const pre = Math.max(0, accts.findIndex(x => x.id === S.acct));
  fan = { cx, cy, r0: 38, r1: Math.round(r2 * 0.58), r2, acct: pre, cat: null, zone: 'idle' };
  clearTimeout(closeFan.t); const el = $('#fan'); el.classList.remove('closing'); el.hidden = false;
  buildFan(); drawFan();
  $('#add').classList.add('fan-open');
  try { navigator.vibrate && navigator.vibrate(30); } catch {}
  SFX.open();
}
function fanMove(x, y) {
  const dx = x - fan.cx, dy = fan.cy - y, r = Math.hypot(dx, dy);
  let ang = Math.atan2(dy, dx) * 180 / Math.PI; if (ang < 0) ang = dx < 0 ? 180 : 0;
  const pick = n => Math.min(n - 1, Math.max(0, Math.floor((180 - ang) / (180 / n))));
  const before = `${fan.zone}|${fan.acct}|${fan.cat}`;
  const nA = settings().accounts.length, under = pick(nA), prevZone = fan.zone;
  // 换账户要「停一下」或「从中间直接往外划过去」，斜斜划过别的账户不会误换
  const settle = () => { clearTimeout(fan.pendT); fan.pend = null; };
  if (r < fan.r0) { settle(); fan.zone = prevZone === 'idle' ? 'idle' : 'cancel'; fan.cat = null; }   // 还没离开过 ＋ 就不算取消
  else if (dy < -10) { settle(); fan.zone = 'idle'; fan.cat = null; }
  else if (r < fan.r1) {
    fan.zone = 'acct'; fan.cat = null;
    if (under === fan.acct) settle();
    else if (!fan.pend || fan.pend.idx !== under) {
      settle(); fan.pend = { idx: under, fromCenter: prevZone === 'cancel' || prevZone === 'idle' };
      fan.pendT = setTimeout(() => { if (fan && fan.pend && fan.pend.idx === under && fan.zone === 'acct') { fan.acct = under; fan.pend = null; drawFan(); SFX.tick(); try { navigator.vibrate && navigator.vibrate(15); } catch {} } }, 150);
    }
  }
  else if (r < fan.r2 + 40) {
    if (fan.pend && fan.pend.fromCenter && fan.pend.idx === under) fan.acct = under;
    settle(); fan.zone = 'cat'; fan.cat = pick(fanCats().length);
  }
  else { settle(); fan.zone = 'out'; fan.cat = null; }
  if (before !== `${fan.zone}|${fan.acct}|${fan.cat}`) {
    drawFan();
    if (fan.zone === 'idle') return;
    if (fan.zone === 'cancel') SFX.cancel(); else SFX.tick();
    try { navigator.vibrate && navigator.vibrate(fan.zone === 'cancel' ? 25 : 15); } catch {}
  }
}
function closeFan(commit) {
  if (!fan) return;
  const f = fan; clearTimeout(f.pendT); fan = null;
  const el = $('#fan'); el.classList.add('closing'); $('#add').classList.remove('fan-open');
  clearTimeout(closeFan.t); closeFan.t = setTimeout(() => { if (!fan) { el.hidden = true; el.innerHTML = ''; el.classList.remove('closing'); } }, 160);
  if (commit && f.cat != null) {
    SFX.done();
    const c = fanCats()[f.cat], a = settings().accounts[f.acct];
    openSheet(null, { cat: c.id, txn: { account: a.id } });
  } else SFX.off();
}
const addBtn = $('#add');
addBtn.addEventListener('contextmenu', e => e.preventDefault());
addBtn.addEventListener('pointerdown', e => {
  if (!S.loaded || e.button > 0) return;
  SFX.warm();
  fanPress = { x: e.clientX, y: e.clientY, t: setTimeout(() => { if (fanPress) openFan(); }, 300) };
  try { addBtn.setPointerCapture(e.pointerId); } catch {}
});
addBtn.addEventListener('pointermove', e => {
  if (fan) { e.preventDefault(); fanMove(e.clientX, e.clientY); return; }
  if (fanPress && Math.hypot(e.clientX - fanPress.x, e.clientY - fanPress.y) > 14) { clearTimeout(fanPress.t); openFan(); fanMove(e.clientX, e.clientY); }
});
addBtn.addEventListener('pointerup', () => { if (fanPress) clearTimeout(fanPress.t); fanPress = null; if (fan) { fanSkipClick = true; closeFan(true); } });
addBtn.addEventListener('pointercancel', () => { if (fanPress) clearTimeout(fanPress.t); fanPress = null; if (fan) { fanSkipClick = true; closeFan(false); } });

function setAlloc(b, rowId, patch) {
  const s = settings();
  saveSettings({ ...s, budget: { ...b, alloc: b.alloc.map(r => r.id === rowId ? { ...r, ...patch } : r) } });
}
$('#view').addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q') { S.q = el.value; render(); return; }
});
$('#view').addEventListener('change', e => {
  const el = e.target, s = settings(), b = budget();
  const num = v => Math.max(0, r2(parseFloat(String(v).replace(/[^0-9.]/g, '')) || 0));
  if (el.id === 'f-cat') { S.cat = el.value; render(); }
  else if (el.id === 'f-acct') { S.acct = el.value; render(); }
  else if (el.dataset.btotal) { saveSettings({ ...s, budget: { ...b, total: num(el.value) } }); toast('预算已保存'); }
  else if (el.dataset.bcat) setAlloc(b, el.dataset.bcat, { cat: el.value });
  else if (el.dataset.bpct) { const p = Math.min(1000, num(el.value)); setAlloc(b, el.dataset.bpct, { by: 'pct', pct: p, amt: r2(b.total * p / 100) }); }
  else if (el.dataset.bamt) { const a = num(el.value); setAlloc(b, el.dataset.bamt, { by: 'amt', amt: a, pct: b.total > 0 ? r2(a / b.total * 100) : 0 }); }
  else if (el.dataset.catname) { const name = el.value.trim(); if (name) saveSettings({ ...s, cats: s.cats.map(c => c.id === el.dataset.catname ? { ...c, name } : c) }); }
  else if (el.dataset.catkind) saveSettings({ ...s, cats: s.cats.map(c => c.id === el.dataset.catkind ? { ...c, kind: el.checked ? 'transfer' : 'normal' } : c) });
  else if (el.dataset.acctname) { const name = el.value.trim(); if (name) saveSettings({ ...s, accounts: s.accounts.map(a => a.id === el.dataset.acctname ? { ...a, name } : a) }); }
  else if (el.dataset.ccset) { const k = el.dataset.ccset; const v = k === 'cards' ? Math.max(1, Math.round(parseFloat(el.value) || 1)) : r2(parseFloat(el.value) || 0); saveSettings({ ...s, accounts: s.accounts.map(a => a.kind === 'credit' ? { ...a, [k]: v } : a) }); toast('已保存'); }
  else if (el.id === 'sfx-on') { SFX.set(el.checked); if (el.checked) { SFX.warm(); SFX.done(); } toast(el.checked ? '音效已打开' : '音效已关掉'); }
  else if (el.dataset.acctopen) { const v = r2(parseFloat(el.value) || 0); saveSettings({ ...s, accounts: s.accounts.map(a => a.id === el.dataset.acctopen ? { ...a, opening: v } : a) }); }
});
$('#view').addEventListener('click', async e => {
  const b = e.target.closest('button, .row, .dbar, .day-item'); if (!b) return;
  if (!$('#rform').hidden) return;
  const s = settings();
  if (b.dataset.ok) { e.stopPropagation(); const t = S.txns.get(b.dataset.ok); if (t) await saveTxn({ ...t, guess: false }); return; }
  if (b.dataset.edit) { const t = S.txns.get(b.dataset.edit); if (t) openSheet(t); return; }
  if (b.dataset.goto) { go(b.dataset.goto); return; }
  if (b.dataset.stnew) { openStmt(null); return; }
  if (b.dataset.stedit) { const x = (S.stmts || []).find(y => y.id === b.dataset.stedit); if (x) openStmt(x); return; }
  if (b.dataset.payundo) { if (S.payBusy) return; if (!b.classList.contains('arm')) { b.classList.add('arm'); b.textContent = '确定撤销全部还款？'; return; } await undoPaid(); return; }
  if (b.dataset.pay) {
    if (S.payBusy) return;
    const a = creditAcct(); const st = cardStmts(a.id)[0]; if (!st) return;
    if (b.dataset.pay === 'full' || b.dataset.pay === 'min') {
      if (S.payArm !== b.dataset.pay) {
        S.payArm = b.dataset.pay; render();
        clearTimeout(markPaid.t); markPaid.t = setTimeout(() => { S.payArm = null; if (!S.payBusy && S.tab === 'card') render(); }, 5000);
        return;
      }
      S.payArm = null; clearTimeout(markPaid.t);
      return markPaid(+b.dataset.amt);
    }
    if (b.dataset.pay === 'other') { $('#cc-other').hidden = false; $('#cc-other-amt').focus(); return; }
    if (b.dataset.pay === 'otherok') { const v = r2(parseFloat(($('#cc-other-amt').value || '').replace(/[^0-9.]/g, '')) || 0); if (!(v > 0)) return toast('先填金额'); if (v > r2(st.amount - st.paid) + 0.001) return toast(`比还欠的 ${money(r2(st.amount - st.paid))} 还多，请检查金额`); return markPaid(v); }
  }
  if (b.dataset.badd) {
    const bud = budget(); const usedCats = new Set(bud.alloc.map(r => r.cat));
    const next = spendCats().find(c => !usedCats.has(c.id));
    saveSettings({ ...s, budget: { ...bud, alloc: [...bud.alloc, { id: 'r' + Date.now().toString(36), cat: next ? next.id : REST, pct: 0 }] } }); return;
  }
  if (b.dataset.bdel) { const bud = budget(); saveSettings({ ...s, budget: { ...bud, alloc: bud.alloc.filter(r => r.id !== b.dataset.bdel) } }); return; }
  if (b.dataset.filtercat) { S.cat = b.dataset.filtercat; S.guessOnly = false; S.q = ''; go('flow'); return; }
  if (b.dataset.guesses) { S.guessOnly = true; S.cat = 'all'; S.q = ''; go('flow'); return; }
  if ('quick' in b.dataset) { if (!S.loaded) return toast('账本还在读取'); openSheet(null, { cat: b.dataset.quick || 'other' }); return; }
  if (b.id === 'guess-toggle') { S.guessOnly = !S.guessOnly; render(); return; }
  if (b.id === 'q-scope') { S.qAll = S.qAll === false; render(); return; }
  if (b.dataset.rrec || b.dataset.rskip || b.dataset.redit) {
    if (S.recBusy) return;
    const id = b.dataset.rrec || b.dataset.rskip || b.dataset.redit; const due = b.dataset.due;
    const it = (settings().recurring || []).find(x => x.id === id); if (!it) return;
    if (b.dataset.rrec) return recurRecord(it, due, recurTxn(it, due));
    if (b.dataset.rskip) return recurSkip(it, due);
    return openSheet(null, { cat: it.cat, txn: recurTxn(it, due), recur: { id, due } });
  }
  if ('ropen' in b.dataset) { const it = (settings().recurring || []).find(x => x.id === b.dataset.ropen); openRecur(it || null); return; }
  if (b.dataset.statview) { S.statView = b.dataset.statview; render(); window.scrollTo(0, 0); return; }
  if (b.dataset.gomonth) { S.month = b.dataset.gomonth; S.statView = 'month'; render(); window.scrollTo(0, 0); return; }
  if (b.dataset.day) { S.statDay = b.dataset.day; render(); return; }
  if (b.dataset.catcolor) { saveSettings({ ...s, cats: s.cats.map(c => c.id === b.dataset.catcolor ? { ...c, color: +b.dataset.n } : c) }); return; }
  if (b.dataset.catdel) {
    if (!b.classList.contains('arm')) { b.classList.add('arm'); b.textContent = '确定删除？'; setTimeout(() => { b.classList.remove('arm'); b.textContent = '删除'; }, 3000); return; }
    const id = b.dataset.catdel;
    const moved = [...S.txns.values()].filter(t => t.cat === id);
    const bud = budget();
    await saveSettings({ ...s, cats: s.cats.filter(c => c.id !== id), rules: Object.fromEntries(Object.entries(s.rules).filter(([, v]) => v !== id)), budget: { ...bud, alloc: bud.alloc.filter(r => r.cat !== id) } });
    await saveTxns(moved.map(t => ({ ...t, cat: 'other' })));
    toast(moved.length ? `已删除，${moved.length} 笔移到“其他”` : '已删除'); return;
  }
  if (b.id === 'add-cat') {
    const name = $('#new-cat').value.trim(); if (!name) return;
    const usedColors = s.cats.map(c => c.color); const col = [8, 1, 2, 3, 4, 5, 6, 7].find(n => !usedColors.includes(n)) || 8;
    saveSettings({ ...s, cats: [...s.cats.filter(c => c.id !== 'other'), { id: 'c' + Date.now().toString(36), name, color: col, kind: 'normal' }, ...s.cats.filter(c => c.id === 'other')] });
    toast('分类已添加'); return;
  }
  if (b.id === 'add-acct') {
    const name = $('#new-acct').value.trim(); if (!name) return;
    saveSettings({ ...s, accounts: [...s.accounts, { id: 'a' + Date.now().toString(36), name, opening: 0 }] });
    toast('账户已添加'); return;
  }
  if (b.id === 'resync') { await reload(); toast('已重新读取'); }
});
$('#view').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset?.edit) { e.preventDefault(); e.target.click(); } });

$('#overlay').addEventListener('click', e => {
  if (e.target.id === 'overlay') return closeSheet();
  const b = e.target.closest('button'); if (!b || !draft) return;
  if (b.id === 'e-back') {
    if (draft._new) { if (draft._step === 1) return closeSheet(); return goStep(draft._step === 3 ? 2 : 1); }
    return draft._step === 3 ? closeSheet() : goStep(3);
  }
  if (b.dataset.key) return padKey(b.dataset.key);
  if (b.dataset.dir) { draft.dir = b.dataset.dir; if (draft.cat && !catChoices().some(c => c.id === draft.cat)) draft.cat = ''; return drawSheet(); }
  if (b.id === 'e-next') return padNext();
  if (b.dataset.pick) { draft.cat = b.dataset.pick; return goStep(3); }
  if (b.dataset.go) return goStep(+b.dataset.go);
  if (b.id === 'e-save') return commitSheet();
  if (b.id === 'e-del') {
    if (!b.classList.contains('arm')) { b.classList.add('arm'); b.textContent = '确定删除？'; return; }
    const id = draft.id; closeSheet(); deleteTxn(id);
  }
});
$('#overlay').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') { e.preventDefault(); commitSheet(); } });
document.addEventListener('keydown', e => {
  if ($('#overlay').hidden || !draft) return;
  if (e.key === 'Escape') return closeSheet();
  if (draft._step === 1 && !e.ctrlKey && !e.metaKey) {
    if (/^[0-9.+-]$/.test(e.key)) { e.preventDefault(); padKey(e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); padKey('⌫'); }
    else if (e.key === 'Delete') { e.preventDefault(); padKey('C'); }
    else if (e.key === 'Enter') { e.preventDefault(); padNext(); }
  }
});

$('#toast').addEventListener('click', e => {
  if (e.target.id !== 'toast-act' || !toast.fn) return;
  const fn = toast.fn; toast.fn = null; clearTimeout(toast.t); $('#toast').hidden = true; fn();
});

/* ---------- boot ---------- */
const APP_VER = '2026-11-18j';
// 新版：先显示手机里存的上次资料（打开快），再到 Google 拿最新的
function replayOutbox() {
  for (const { fn, args } of store.get('ledger.outbox') || []) {
    if (fn === 'saveTxn') S.txns.set(args[0].id, args[0]);
    else if (fn === 'saveTxns') (args[0] || []).forEach(t => S.txns.set(t.id, t));
    else if (fn === 'deleteTxn') S.txns.delete(args[0]);
    else if (fn === 'saveSettings') S.settings = { ...DEFAULT_SETTINGS, ...args[0] };
  }
}
function showConnect() {
  $('#view').innerHTML = `<section class="card"><h2>连接你的账本</h2>
    <p class="note" style="margin-top:0">第一次用要连接 Google Sheet。请用我给你的那条链接打开，或把整条链接贴在下面。</p>
    <div class="addline"><input id="conn-in" placeholder="贴上链接" aria-label="连接链接"><button class="btn primary" id="conn-ok">连接</button></div></section>`;
  $('#conn-ok').onclick = () => {
    const v = $('#conn-in').value.trim(), i = v.indexOf('#');
    if (i < 0) return toast('链接不完整，要包含 # 后面的部分');
    location.hash = v.slice(i + 1); CONN = readConn();
    if (!CONN) return toast('链接不对，请再检查一下');
    bootWeb();
  };
}
async function checkUpdate() {
  try {
    const r = await fetch('version.json', { cache: 'no-store' }); const v = (await r.json()).v;
    if (v && v !== APP_VER) toast('有新版本', { label: '更新', fn: () => location.reload() });
  } catch {}
}
function bootWeb() {
  if (!CONN) { renderHeader(); return showConnect(); }
  const c = store.get('ledger.cache');
  if (c && !S.loaded) { try { applyData(c); replayOutbox(); S.loaded = true; } catch {} }
  route(); reload(); setTimeout(checkUpdate, 3000);
}
if (WEB) {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  addEventListener('online', () => { if (S.loaded) reload(); });
  addEventListener('hashchange', () => { const c = readConn(); if (c && (!CONN || c.k !== CONN.k || c.u !== CONN.u)) { CONN = c; bootWeb(); } });
  bootWeb();
} else { route(); reload(); }
// 回到 App 时（例如在电脑上改过 Sheet）自动重新读取
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.loaded && Date.now() - lastLoad > 30000 && $('#overlay').hidden) reload();
});
})();
</script>
